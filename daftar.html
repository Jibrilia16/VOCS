    <main>
      <!-- ===== FORMULIR PENDAFTARAN ===== -->
      <section id="daftar">
        <h2>Formulir Pendaftaran</h2>
        <form action="#" method="post">
          <fieldset>
            <legend>Data Pendaftar</legend>

            <label for="nama">Nama Lengkap</label>
            <input type="text" id="nama" name="nama" required />

            <label for="nim">NIM</label>
            <input type="text" id="nim" name="nim" required />

            <label for="prodi">Program Studi</label>
            <select id="prodi" name="prodi">
              <option>Informatika</option>
              <option>Sistem Informasi</option>
              <option>Teknologi Informasi</option>
              <option>Lainnya</option>
            </select>

            <label for="Divisi">Divisi</label>
            <select id="Divisi" name="Divisi">
              <option>Singers (Sopran, Alto, Tenor, Bass)</option>
              <option>Multimedia</option>
              <option>Pianist</option>
            </select>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required />

            <label for="telp">No. HP / WhatsApp</label>
            <input type="tel" id="telp" name="telp" required />

            <label for="catatan">Catatan (opsional)</label>
            <textarea id="catatan" name="catatan" rows="3"></textarea>

            <button type="submit">Kirim Pendaftaran</button>
          </fieldset>
        </form>
      </section>
    </main>
